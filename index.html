<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จองที่นั่งรถตู้ - ยินดีที่ได้เจอ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#121214',
                        cardBg: '#1E1E24',
                        accentOrange: '#FF7A00',
                        accentHover: '#E06A00',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen flex justify-center items-center p-0 sm:p-4">

    <!-- Mobile Frame Container -->
    <div class="w-full max-w-md bg-darkBg sm:bg-cardBg sm:rounded-3xl sm:shadow-2xl overflow-hidden flex flex-col min-h-screen sm:min-h-[85vh] border border-gray-800">
        
        <!-- Header -->
        <div class="p-6 bg-gradient-to-b from-[#1E1E24] to-darkBg border-b border-gray-800">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <span class="text-xs tracking-widest text-accentOrange uppercase font-semibold">Van Booking System</span>
                    <h1 class="text-2xl font-bold tracking-wide">ยินดีที่ได้เจอ</h1>
                </div>
                <div class="w-10 h-10 rounded-full bg-accentOrange/10 border border-accentOrange/30 flex items-center justify-center text-accentOrange font-bold">
                    🚐
                </div>
            </div>

            <!-- Route Card -->
            <div class="bg-cardBg/80 backdrop-blur-md p-4 rounded-2xl border border-gray-700/50 space-y-2">
                <div class="flex justify-between text-sm text-gray-400">
                    <span>เส้นทางเดินทาง</span>
                    <span class="text-accentOrange font-medium">฿180 / ที่นั่ง</span>
                </div>
                <div class="flex items-center justify-between font-semibold text-base">
                    <span>กรุงเทพฯ (หมอชิต)</span>
                    <span class="text-gray-500">➔</span>
                    <span>กาญจนบุรี</span>
                </div>
                <div class="pt-2 border-t border-gray-700/40 flex justify-between text-xs text-gray-400">
                    <span>📅 ศุกร์, 21 ส.ค. 2026</span>
                    <span class="text-gray-200 bg-gray-700/60 px-2 py-0.5 rounded-full">รอบ 09:30 น.</span>
                </div>
            </div>
        </div>

        <!-- Seat Selection Section -->
        <div class="flex-1 p-6 space-y-6">
            <div class="text-center">
                <h2 class="text-sm font-medium text-gray-300">เลือกที่นั่งของคุณ</h2>
                <p class="text-xs text-gray-500 mt-0.5">แตะที่นั่งที่ต้องการ (สีส้มคือที่นั่งของคุณ)</p>
            </div>

            <!-- Legend Status -->
            <div class="flex justify-center gap-4 text-xs">
                <div class="flex items-center gap-1.5">
                    <div class="w-3.5 h-3.5 rounded bg-gray-800 border border-gray-600"></div>
                    <span class="text-gray-400">ว่าง</span>
                </div>
                <div class="flex items-center gap-1.5">
                    <div class="w-3.5 h-3.5 rounded bg-accentOrange shadow-sm shadow-accentOrange/50"></div>
                    <span class="text-gray-200 font-medium">เลือกแล้ว</span>
                </div>
                <div class="flex items-center gap-1.5">
                    <div class="w-3.5 h-3.5 rounded bg-gray-900 border border-gray-800 opacity-40"></div>
                    <span class="text-gray-600">ไม่ว่าง</span>
                </div>
            </div>

            <!-- Van Interior Layout -->
            <div class="bg-[#18181D] border border-gray-800 rounded-3xl p-6 relative shadow-inner max-w-xs mx-auto">
                
                <!-- Front Car Indicator -->
                <div class="flex justify-between items-center pb-4 mb-6 border-b border-gray-800/80 text-xs text-gray-500 font-medium">
                    <span class="bg-gray-800 px-2 py-1 rounded text-gray-400">🚪 ประตูขึ้น-ลง</span>
                    <span class="bg-gray-800 px-2 py-1 rounded text-gray-400">👤 คนขับ</span>
                </div>

                <!-- Seats Grid -->
                <div class="space-y-4">
                    <!-- Row 1 (Front Passenger) -->
                    <div class="flex justify-between items-center px-4">
                        <button onclick="toggleSeat(this, 'A1')" class="seat w-12 h-12 rounded-xl bg-gray-800 border border-gray-700 text-xs font-bold transition-all hover:border-gray-500 flex flex-col items-center justify-center">
                            <span>A1</span>
                            <span class="text-[9px] text-gray-500 font-normal">หน้า</span>
                        </button>
                        <div class="w-12 h-12"></div> <!-- ช่องว่างทางเดิน -->
                    </div>

                    <!-- Row 2 -->
                    <div class="grid grid-cols-3 gap-3">
                        <button onclick="toggleSeat(this, 'B1')" class="seat w-12 h-12 rounded-xl bg-gray-800 border border-gray-700 text-xs font-bold transition-all hover:border-gray-500 flex flex-col items-center justify-center">B1</button>
                        <button onclick="toggleSeat(this, 'B2')" class="seat w-12 h-12 rounded-xl bg-gray-900 border border-gray-800 text-xs font-bold text-gray-700 cursor-not-allowed flex flex-col items-center justify-center" disabled>B2</button>
                        <button onclick="toggleSeat(this, 'B3')" class="seat w-12 h-12 rounded-xl bg-gray-800 border border-gray-700 text-xs font-bold transition-all hover:border-gray-500 flex flex-col items-center justify-center">B3</button>
                    </div>

                    <!-- Row 3 -->
                    <div class="grid grid-cols-3 gap-3">
                        <button onclick="toggleSeat(this, 'C1')" class="seat w-12 h-12 rounded-xl bg-gray-800 border border-gray-700 text-xs font-bold transition-all hover:border-gray-500 flex flex-col items-center justify-center">C1</button>
                        <button onclick="toggleSeat(this, 'C2')" class="seat w-12 h-12 rounded-xl bg-gray-800 border border-gray-700 text-xs font-bold transition-all hover:border-gray-500 flex flex-col items-center justify-center">C2</button>
                        <button onclick="toggleSeat(this, 'C3')" class="seat w-12 h-12 rounded-xl bg-gray-800 border border-gray-700 text-xs font-bold transition-all hover:border-gray-500 flex flex-col items-center justify-center">C3</button>
                    </div>

                    <!-- Row 4 (Back Row - 4 seats) -->
                    <div class="grid grid-cols-4 gap-2 pt-2 border-t border-gray-800/50">
                        <button onclick="toggleSeat(this, 'D1')" class="seat w-10 h-11 rounded-lg bg-gray-800 border border-gray-700 text-[11px] font-bold transition-all hover:border-gray-500 flex items-center justify-center">D1</button>
                        <button onclick="toggleSeat(this, 'D2')" class="seat w-10 h-11 rounded-lg bg-gray-800 border border-gray-700 text-[11px] font-bold transition-all hover:border-gray-500 flex items-center justify-center">D2</button>
                        <button onclick="toggleSeat(this, 'D3')" class="seat w-10 h-11 rounded-lg bg-gray-900 border border-gray-800 text-[11px] font-bold text-gray-700 cursor-not-allowed flex items-center justify-center" disabled>D3</button>
                        <button onclick="toggleSeat(this, 'D4')" class="seat w-10 h-11 rounded-lg bg-gray-800 border border-gray-700 text-[11px] font-bold transition-all hover:border-gray-500 flex items-center justify-center">D4</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sticky Footer Summary & CTA -->
        <div class="p-4 bg-[#1A1A22] border-t border-gray-800 flex items-center justify-between">
            <div>
                <p class="text-xs text-gray-400">เลือกแล้ว (<span id="selectedCount">0</span> ที่นั่ง)</p>
                <p class="text-lg font-bold text-accentOrange">฿<span id="totalPrice">0</span></p>
            </div>
            <button onclick="alert('ไปสู่หน้าชำระเงินของเพจ ยินดีที่ได้เจอ ✨')" class="bg-gradient-to-r from-accentOrange to-[#FF5500] hover:from-accentHover hover:to-[#E04800] text-white font-semibold px-6 py-3 rounded-2xl shadow-lg shadow-accentOrange/25 transition-all text-sm">
                ยืนยันที่นั่ง ✨
            </button>
        </div>

    </div>

    <!-- JavaScript สำหรับกดเลือก/ยกเลิกที่นั่งแบบอินเทอร์แอกทีฟ -->
    <script>
        const pricePerSeat = 180;
        let selectedSeats = [];

        function toggleSeat(button, seatName) {
            if (button.classList.contains('bg-accentOrange')) {
                // ยกเลิกเลือก
                button.classList.remove('bg-accentOrange', 'border-transparent', 'text-white', 'shadow-md', 'shadow-accentOrange/40');
                button.classList.add('bg-gray-800', 'border-gray-700', 'text-gray-100');
                selectedSeats = selectedSeats.filter(s => s !== seatName);
            } else {
                // เลือกที่นั่ง
                button.classList.remove('bg-gray-800', 'border-gray-700', 'text-gray-100');
                button.classList.add('bg-accentOrange', 'border-transparent', 'text-white', 'shadow-md', 'shadow-accentOrange/40');
                selectedSeats.push(seatName);
            }
            updateSummary();
        }

        function updateSummary() {
            document.getElementById('selectedCount').innerText = selectedSeats.length;
            document.getElementById('totalPrice').innerText = selectedSeats.length * pricePerSeat;
        }
    </script>
</body>
</html>
